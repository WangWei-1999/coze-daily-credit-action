name: Coze daily credit

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Coze daily action
        env:
          COZE_STORAGE_STATE_JSON: ${{ secrets.COZE_STORAGE_STATE_JSON }}
          COZE_COOKIES_JSON: ${{ secrets.COZE_COOKIES_JSON }}
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          PLAYWRIGHT_TIMEOUT_MS: "30000"
          POST_LOAD_WAIT_MS: "5000"
        run: npm start

      - name: Update Coze cookie secret
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          COZE_SECRET_NAME: COZE_COOKIES_JSON
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run update-secret

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coze-failure
          path: artifacts/
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          if Path("artifacts/notification.sent").exists():
              print("Failure notification was already sent by the script; skip fallback notification.")
              raise SystemExit(0)

          title = "Coze每日积分失败"
          content = "\n".join(
              item for item in [
                  "GitHub Actions 运行失败。",
                  f"仓库：{os.environ.get('REPOSITORY', '')}" if os.environ.get("REPOSITORY") else "",
                  f"运行记录：{os.environ.get('RUN_URL', '')}" if os.environ.get("RUN_URL") else "",
              ] if item
          )

          def send_bark():
              base = os.environ.get("BARK_PUSH_URL", "").strip().rstrip("/")
              if not base:
                  print("BARK_PUSH_URL is not set; skip Bark notification.")
                  return False

              url = f"{base}/{urllib.parse.quote(title, safe='')}/{urllib.parse.quote(content, safe='')}"
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      print("Bark notification sent.")
                      return 200 <= response.status < 300
              except Exception as error:
                  print(f"Bark notification failed: {error}")
                  return False

          def send_pushplus():
              token = os.environ.get("PUSHPLUS_TOKEN", "").strip()
              if not token:
                  print("PUSHPLUS_TOKEN is not set; skip pushplus notification.")
                  return False

              payload = {
                  "token": token,
                  "title": title,
                  "content": content,
                  "template": "txt",
              }
              topic = os.environ.get("PUSHPLUS_TOPIC", "").strip()
              if topic:
                  payload["topic"] = topic

              request = urllib.request.Request(
                  "https://www.pushplus.plus/send",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode("utf-8", errors="replace")
                  result = json.loads(body)
                  if result.get("code") != 200:
                      print(f"pushplus returned code {result.get('code')}: {result.get('msg') or body}")
                      return False
                  print("pushplus notification sent.")
                  return True
              except Exception as error:
                  print(f"pushplus notification failed: {error}")
                  return False

          results = [send_bark(), send_pushplus()]
          if not any(results):
              print("No failure notification was sent. Check whether notification secrets are configured.")
          PY

      - name: Upload updated storage state
        if: ${{ success() && vars.UPLOAD_UPDATED_STORAGE_STATE == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: coze-storage-state
          path: artifacts/storage_state.updated.json
          if-no-files-found: ignore
          retention-days: 3
          
  notify-on-failure:
    needs: daily  # 比如 coze-daily-credit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Feishu on failure
        uses: actions/github-script@v7
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        with:
          script: |
            const crypto = require('crypto');
            const now = Math.floor(Date.now() / 1000);
            const secret = process.env.FEISHU_SECRET || '';
            let sign = '';
            if (secret) {
              const stringToSign = `${now}\n${secret}`;
              sign = crypto.createHmac('sha256', stringToSign).digest('base64');
            }

            const payload = {
              msg_type: 'text',
              content: {
                text: `❌ Coze 每日签到失败\n\n` +
                      `仓库：${context.repo.owner}/${context.repo.repo}\n` +
                      `时间：${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}\n` +
                      `原因：可能是 Cookie 失效或页面结构变化\n\n` +
                      `请前往查看：https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              }
            };

            if (sign) {
              payload.timestamp = String(now);
              payload.sign = sign;
            }

            const res = await fetch(process.env.FEISHU_WEBHOOK, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            console.log('Feishu response:', data);
